[package]
name = "devo"
version = "2.0.0"
edition = "2021"
description = "Generate and run tmux workflows from a small YAML DSL"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["string"] }
jmespath = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
