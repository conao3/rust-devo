[package]
name = "devo"
version = "1.0.8"
edition = "2021"
description = "Generate and run tmux workflows from a small YAML DSL"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
